<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>폼코치</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --line: #2a323c; --fg: #e8edf2; --muted: #8a97a6;
    --accent: #ffb020; --good: #3ddc84; --warn: #ff5c5c; --skel: #4fc3f7;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }

  /* ── 메인 화면: 카메라가 전체 ── */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--sat) + 10px) 14px 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; font-variant-numeric: tabular-nums; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .exname { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin-bottom: 2px; }
  .big { font-size: 46px; font-weight: 800; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .big small { font-size: 13px; font-weight: 600; color: #cdd6df; display: block; margin-top: 4px; }
  .reps { text-align: right; }
  .checks { position: absolute; right: 10px; top: calc(var(--sat) + 96px); display: grid; gap: 4px; pointer-events: none; }
  .chk { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,.5); color: #9aa6b2; text-align: right; }
  .chk.on { color: #fff; background: rgba(255,92,92,.85); }
  .chk.ok { color: var(--good); }
  .cue { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 14px 16px; text-align: center; font-size: 24px; font-weight: 800; pointer-events: none; background: linear-gradient(transparent, rgba(0,0,0,.8)); min-height: 64px; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  .cue.good { color: var(--good); } .cue.warn { color: var(--warn); } .cue.info { color: var(--accent); }

  /* ── 하단 바 ── */
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 14px calc(var(--sab) + 10px); background: var(--panel); border-top: 1px solid var(--line); }
  .bar button { flex: 1; }
  button, select { font: inherit; font-weight: 700; border-radius: 12px; padding: 13px 14px; cursor: pointer; font-size: 15px; border: 0; }
  button.primary { color: #111; background: var(--accent); }
  button.ghost { background: #222932; color: var(--fg); border: 1px solid var(--line); }
  button.icon { flex: 0 0 52px; font-size: 20px; padding: 11px 0; }
  button:disabled { opacity: .6; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  select { background: #222932; color: var(--fg); border: 1px solid var(--line); width: 100%; }

  /* ── 시작 오버레이 ── */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(15,18,22,.94); text-align: center; padding: 24px; }
  .overlay h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 32ch; line-height: 1.5; }
  .overlay .w { width: min(100%, 320px); display: grid; gap: 10px; }

  /* ── 바텀 시트 (설정 / 리포트) ── */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--panel); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); box-shadow: 0 -10px 40px rgba(0,0,0,.5); transform: translateY(100%); transition: transform .25s ease; display: flex; flex-direction: column; z-index: 20; }
  .sheet.open { transform: translateY(0); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 0; }
  .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; }
  .sheet h2 { font-size: 17px; margin: 0; }
  .sheet .close { background: none; color: var(--muted); font-size: 22px; padding: 4px 8px; }
  .sheet .body { overflow-y: auto; padding: 6px 16px calc(var(--sab) + 18px); display: grid; gap: 14px; -webkit-overflow-scrolling: touch; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 19; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 13px; color: var(--muted); }
  .field b { color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .toggle:first-of-type { border-top: 0; }
  .sw { width: 48px; height: 28px; border-radius: 14px; background: #3a4450; position: relative; transition: background .2s; border: 0; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
  .sw.on { background: var(--good); } .sw.on::after { left: 23px; }
  .camhint { font-size: 13px; color: var(--accent); background: rgba(255,176,32,.1); padding: 10px 12px; border-radius: 10px; line-height: 1.45; }
  .section { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }

  /* ── 리포트 ── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
  .kpi { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  #chart { width: 100%; height: 130px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .advice { font-size: 14px; line-height: 1.55; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .log { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: grid; }
  .log div { padding: 7px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .log div:first-child { border-top: 0; }
  .score { font-weight: 800; min-width: 32px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,92,92,.15); color: var(--warn); }
  .tag.ok { background: rgba(61,220,132,.15); color: var(--good); }
  .ok { color: var(--good); } .bad { color: var(--warn); }
  .toast { position: fixed; left: 50%; top: calc(var(--sat) + 14px); transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; z-index: 30; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .sheet, .sw, .sw::after, .toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="top">
      <div><div class="exname" id="exName">레그프레스</div><div class="big"><span id="angle">--</span>°<small id="angleLabel">무릎 각도</small></div></div>
      <div class="big reps"><span id="reps">0</span><small>반복</small></div>
    </div>
    <div class="checks" id="checks"></div>
    <div class="cue info" id="cue"></div>

    <div class="overlay" id="overlay">
      <h1>폼코치</h1>
      <p id="status">포즈 모델을 불러오는 중이에요. 첫 로딩은 10~20초 걸릴 수 있어요.</p>
      <div class="w">
        <select id="exSel0" aria-label="운동 종목"></select>
        <button class="ghost" id="preFacing">후면 카메라로 시작 · 눌러서 변경</button>
        <button class="primary" id="startBtn" disabled>준비 중...</button>
      </div>
      <p id="camHint0" class="camhint"></p>
    </div>
  </div>

  <div class="bar">
    <button class="ghost icon" id="switchBtn" title="카메라 전환">🔄</button>
    <button class="primary" id="endSetBtn">세트 종료</button>
    <button class="ghost icon" id="settingsBtn" title="설정">⚙️</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<!-- 설정 시트 -->
<div class="sheet" id="settings" role="dialog" aria-label="설정">
  <div class="grab"></div>
  <header><h2>설정</h2><button class="close" id="closeSettings" aria-label="닫기">✕</button></header>
  <div class="body">
    <div class="field"><span>운동 종목</span><select id="exSel"></select></div>
    <div class="camhint" id="camHint"></div>
    <div class="section">판정 기준</div>
    <label class="field"><span>굽힘 기준 — 이 각도 아래면 충분히 굽힘 <b id="downVal">95°</b></span><input type="range" id="downTh" min="30" max="140" value="95"></label>
    <label class="field"><span>폄 기준 — 이 각도 위면 다 폈음 <b id="upVal">155°</b></span><input type="range" id="upTh" min="100" max="178" value="155"></label>
    <div class="section">카메라</div>
    <div class="field"><span>카메라 선택</span><select id="camSel"></select></div>
    <div class="toggle"><span>화면 좌우 반전</span><button class="sw" id="flipSw" aria-label="좌우 반전"></button></div>
    <div class="section">피드백</div>
    <div class="toggle"><span>음성 안내</span><button class="sw on" id="voiceSw" aria-label="음성 안내"></button></div>
    <button class="ghost" id="voiceTest">🔊 음성 테스트</button>
    <div id="voiceInfo" style="font-size:12px;color:var(--muted);line-height:1.5"></div>
    <div class="section">기타</div>
    <button class="ghost" id="resetBtn">카운트 초기화</button>
    <div style="font-size:12px;color:var(--muted);line-height:1.5">FPS <b id="fps">0</b> · 추적 <b id="side">-</b> · 신뢰도 <b id="conf">-</b><br>영상은 기기 안에서만 처리되며 저장·전송되지 않습니다.</div>
  </div>
</div>

<!-- 리포트 시트 -->
<div class="sheet" id="reportSheet" role="dialog" aria-label="세트 리포트">
  <div class="grab"></div>
  <header><h2 id="reportTitle">세트 리포트</h2><button class="close" id="closeReport" aria-label="닫기">✕</button></header>
  <div class="body">
    <div class="kpis" id="kpis"></div>
    <canvas id="chart"></canvas>
    <div class="advice" id="advice"></div>
    <div class="section">반복별 기록</div>
    <div class="log" id="log"></div>
    <button class="primary" id="nextSetBtn">다음 세트 시작</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ───────── 관절·종목 정의 ─────────
const LM = { LS:11, RS:12, LE:13, RE:14, LW:15, RW:16, LH:23, RH:24, LK:25, RK:26, LA:27, RA:28 };
const JOINT = {
  knee:  { L: [23,25,27], R: [24,26,28], label: "무릎 각도", minPhys: 30 },
  elbow: { L: [11,13,15], R: [12,14,16], label: "팔꿈치 각도", minPhys: 25 },
  hip:   { L: [11,23,25], R: [12,24,26], label: "고관절 각도", minPhys: 35 },
};
const ALL = ["depth","lockout","tempo","sym","fatigue"];
const EXERCISES = [
  { id:"legpress",  name:"레그프레스",       joint:"knee",  low:95,  high:155, cam:"측면. 머신 옆에 세우고 엉덩이~발이 다 보이게", cueLow:"더 내리세요", cueHigh:"끝까지 미세요", checks:[...ALL,"hip","valgus"] },
  { id:"squat",     name:"스쿼트",           joint:"knee",  low:100, high:160, cam:"측면 또는 45도. 전신이 보이게", cueLow:"더 앉으세요", cueHigh:"끝까지 일어나세요", checks:[...ALL,"valgus"] },
  { id:"legext",    name:"레그 익스텐션",     joint:"knee",  low:100, high:160, cam:"측면. 허벅지와 정강이가 보이게", cueLow:"더 내리세요", cueHigh:"끝까지 펴세요", checks:[...ALL,"hip"] },
  { id:"legcurl",   name:"레그 컬",          joint:"knee",  low:80,  high:150, cam:"측면. 엎드린 채 다리 전체가 보이게", cueLow:"더 당기세요", cueHigh:"끝까지 펴세요", checks:[...ALL,"hip"] },
  { id:"chest",     name:"체스트 프레스",     joint:"elbow", low:90,  high:155, cam:"측면. 어깨~손이 보이게", cueLow:"더 당겨오세요", cueHigh:"끝까지 미세요", checks:ALL },
  { id:"shoulder",  name:"숄더 프레스",       joint:"elbow", low:90,  high:160, cam:"측면 또는 정면. 어깨~손이 보이게", cueLow:"더 내리세요", cueHigh:"끝까지 올리세요", checks:ALL },
  { id:"latpull",   name:"랫풀다운",         joint:"elbow", low:70,  high:150, cam:"측면 또는 후면. 어깨~손이 보이게", cueLow:"더 당기세요", cueHigh:"끝까지 펴세요", checks:ALL },
  { id:"row",       name:"시티드 로우",       joint:"elbow", low:60,  high:150, cam:"측면. 어깨~손이 보이게", cueLow:"더 당기세요", cueHigh:"끝까지 펴세요", checks:ALL },
  { id:"curl",      name:"바이셉 컬",         joint:"elbow", low:55,  high:150, cam:"측면. 어깨~손이 보이게", cueLow:"더 올리세요", cueHigh:"끝까지 내리세요", checks:ALL },
  { id:"tricep",    name:"트라이셉 푸시다운", joint:"elbow", low:90,  high:160, cam:"측면. 어깨~손이 보이게", cueLow:"더 올리세요", cueHigh:"끝까지 누르세요", checks:ALL },
  { id:"pushup",    name:"푸시업",           joint:"elbow", low:90,  high:155, cam:"측면. 전신이 보이게", cueLow:"더 내리세요", cueHigh:"끝까지 미세요", checks:ALL },
  { id:"deadlift",  name:"데드리프트",        joint:"hip",   low:90,  high:165, cam:"측면. 전신이 보이게", cueLow:"더 숙이세요", cueHigh:"끝까지 펴세요", checks:ALL },
  { id:"hipthrust", name:"힙 쓰러스트",       joint:"hip",   low:100, high:165, cam:"측면. 어깨~무릎이 보이게", cueLow:"더 내리세요", cueHigh:"끝까지 올리세요", checks:ALL },
];
const CHECK_LABEL = { depth:"가동범위", lockout:"끝까지 폄", tempo:"반동/속도", hip:"엉덩이 고정", sym:"좌우 대칭", valgus:"무릎 모임", fatigue:"가동범위 유지" };
let EX = EXERCISES[0];

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const angleEl = $("angle"), repsEl = $("reps"), cueEl = $("cue"), statusEl = $("status");
const overlay = $("overlay"), startBtn = $("startBtn"), camSel = $("camSel"), exSel = $("exSel"), exSel0 = $("exSel0");
const downTh = $("downTh"), upTh = $("upTh"), downVal = $("downVal"), upVal = $("upVal");
const logEl = $("log"), checksEl = $("checks");

let landmarker, running = false, voice = true, mirrored = false;
let lastSpeak = 0, lastT = performance.now(), frames = 0, smooth = null, lastGood = null;
const win = [];
const MIN_REP_MS = 600, CONF_TH = 0.6;
let reps = 0, setNo = 1, phase = null, repList = [], cur = null, hipAnchor = null, torsoLen = 1;

// ───────── 시트 / 토스트 ─────────
const scrim = $("scrim");
function openSheet(id) { $(id).classList.add("open"); scrim.hidden = false; }
function closeSheets() { document.querySelectorAll(".sheet").forEach(s => s.classList.remove("open")); scrim.hidden = true; }
scrim.onclick = closeSheets;
$("settingsBtn").onclick = () => openSheet("settings");
$("closeSettings").onclick = closeSheets; $("closeReport").onclick = closeSheets;
let toastT; function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600); }

// ───────── 종목 ─────────
for (const sel of [exSel, exSel0]) EXERCISES.forEach(e => { const o = document.createElement("option"); o.value = e.id; o.textContent = e.name; sel.append(o); });
function applyExercise(id) {
  EX = EXERCISES.find(e => e.id === id) || EXERCISES[0];
  exSel.value = EX.id; exSel0.value = EX.id;
  downTh.value = EX.low; upTh.value = EX.high; downVal.textContent = EX.low + "°"; upVal.textContent = EX.high + "°";
  $("angleLabel").textContent = JOINT[EX.joint].label; $("exName").textContent = EX.name;
  $("camHint").textContent = "📷 " + EX.cam; $("camHint0").textContent = "📷 " + EX.cam;
  checksEl.innerHTML = EX.checks.map(c => `<div class="chk" id="chk-${c}">${CHECK_LABEL[c]}</div>`).join("");
  resetSet(); setNo = 1;
}
exSel.onchange = () => { applyExercise(exSel.value); toast(EX.name); };
exSel0.onchange = () => applyExercise(exSel0.value);
applyExercise("legpress");
downTh.oninput = () => downVal.textContent = downTh.value + "°";
upTh.oninput = () => upVal.textContent = upTh.value + "°";
function resetSet() { reps = 0; repsEl.textContent = 0; repList = []; phase = null; cur = null; hipAnchor = null; win.length = 0; smooth = null; lastGood = null; EX.checks.forEach(c => setChk(c, "")); }
$("resetBtn").onclick = () => { resetSet(); closeSheets(); toast("초기화했어요"); };
$("voiceSw").onclick = e => { voice = !voice; e.target.classList.toggle("on", voice); };
$("voiceTest").onclick = () => {
  unlockAudio(); lastSpeak = 0; ttsOk = false;
  speak("음성 테스트, 잘 들리면 준비 완료", "info");
  const vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
  const ko = vs.filter(v => /ko/i.test(v.lang)).map(v => v.name);
  $("voiceInfo").textContent = !("speechSynthesis" in window) ? "이 브라우저는 음성 합성을 지원하지 않아요. 알림음으로 대체됩니다."
    : ko.length ? `한국어 음성: ${ko.slice(0, 3).join(", ")}` : "한국어 음성이 없어요. 폰 설정 → TTS에서 한국어를 설치하세요. (iPhone은 무음 스위치 확인)";
};
$("flipSw").onclick = e => { mirrored = !mirrored; e.target.classList.toggle("on", mirrored); applyMirrorCss(); };
function applyMirrorCss() { const t = mirrored ? "scaleX(-1)" : "none"; video.style.transform = t; canvas.style.transform = t; $("flipSw").classList.toggle("on", mirrored); }

// ── 음성/알림음 ──
let koVoice = null, audioCtx = null, ttsOk = false;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /ko/i.test(v.lang) && /Google|Yuna|Siri|Samsung/i.test(v.name)) || vs.find(v => /ko/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function beep(kind) { // 음성이 안 될 때를 위한 짧은 알림음
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = kind === "warn" ? 330 : 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (kind === "warn" ? 0.35 : 0.15));
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.4);
  } catch {}
}
function unlockAudio() { // 첫 터치에서 음성·오디오 권한 열기 (iOS 필수)
  beep("ok");
  if ("speechSynthesis" in window) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {} }
}
function speak(text, cls) {
  cueEl.textContent = text; cueEl.className = "cue " + cls;
  const now = performance.now();
  if (!voice || now - lastSpeak < 1200) return;
  lastSpeak = now;
  if (!("speechSynthesis" in window)) { beep(cls); return; }
  try {
    speechSynthesis.cancel();
    setTimeout(() => { // 취소 직후 바로 speak하면 일부 폰에서 누락됨
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR"; u.rate = 1.05; u.volume = 1; if (koVoice) u.voice = koVoice;
      u.onstart = () => { ttsOk = true; };
      u.onerror = () => beep(cls);
      speechSynthesis.speak(u);
      setTimeout(() => { if (!ttsOk) beep(cls); }, 700); // 음성이 전혀 안 나오면 알림음으로 대체
    }, 60);
  } catch { beep(cls); }
}
function hint(text, cls) { cueEl.textContent = text; cueEl.className = "cue " + cls; }
function setChk(name, state) { const el = $("chk-" + name); if (el) el.className = "chk" + (state === "on" ? " on" : state === "ok" ? " ok" : ""); }

// ───────── 기하 ─────────
function angleAt(a, b, c) {
  const v1 = { x: a.x - b.x, y: a.y - b.y }, v2 = { x: c.x - b.x, y: c.y - b.y };
  const dot = v1.x * v2.x + v1.y * v2.y; const m = Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y) || 1e-6;
  return Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI;
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function median(v) { win.push(v); if (win.length > 5) win.shift(); const s = [...win].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; }

// ───────── 반복 판정 ─────────
function newRep(now, angle, conf) { return { tStart: now, tBottom: now, tEnd: 0, min: angle, max: angle, confSum: conf, confN: 1, hipMove: 0, symDiff: 0, valgus: 0, prevAngle: angle, prevT: now }; }
function judge(angle, conf, f) {
  const low = +downTh.value, high = +upTh.value, now = performance.now();
  if (phase === null) { phase = angle > (low + high) / 2 ? "high" : "low"; return; }
  if (phase === "high") {
    if (angle < high - 10 && !cur) { cur = newRep(now, angle, conf); hipAnchor = f.hip; torsoLen = f.torso; }
    if (angle < low) { phase = "low"; speak("좋아요", "good"); setChk("depth", "ok"); }
    else if (cur && angle < high - 10 && now - lastSpeak > 2000) hint(EX.cueLow, "warn");
    if (cur) accumulate(cur, angle, conf, f, now);
  } else {
    if (!cur) cur = newRep(now, angle, conf);
    accumulate(cur, angle, conf, f, now);
    if (angle > high) {
      cur.tEnd = now; phase = "high";
      if (cur.tEnd - cur.tStart < MIN_REP_MS) { hint("너무 빨라요", "warn"); cur = null; return; }
      finishRep(cur, low, high); cur = null;
    } else if (angle > low + 20 && now - cur.tStart > 1500 && now - lastSpeak > 2500) speak(EX.cueHigh, "warn");
  }
}
function accumulate(r, angle, conf, f, now) {
  if (angle < r.min) { r.min = angle; r.tBottom = now; }
  r.max = Math.max(r.max, angle); r.confSum += conf; r.confN++; r.prevAngle = angle; r.prevT = now;
  if (hipAnchor && f.hip) r.hipMove = Math.max(r.hipMove, dist(f.hip, hipAnchor) / (torsoLen || 1));
  if (f.symDiff != null) r.symDiff = Math.max(r.symDiff, f.symDiff);
  if (f.valgus != null) r.valgus = Math.min(r.valgus || 9, f.valgus);
  setChk("hip", r.hipMove > 0.08 ? "on" : ""); setChk("sym", r.symDiff > 15 ? "on" : ""); setChk("valgus", (r.valgus && r.valgus < 0.75) ? "on" : "");
}
function finishRep(r, low, high) {
  reps++; repsEl.textContent = reps;
  const ecc = (r.tBottom - r.tStart) / 1000, con = (r.tEnd - r.tBottom) / 1000;
  const flags = [];
  if (r.min > low) flags.push("depth");
  if (r.max < high) flags.push("lockout");
  if (EX.checks.includes("tempo") && (ecc < 0.5 || con < 0.3)) flags.push("tempo");
  if (EX.checks.includes("hip") && r.hipMove > 0.08) flags.push("hip");
  if (EX.checks.includes("sym") && r.symDiff > 15) flags.push("sym");
  if (EX.checks.includes("valgus") && r.valgus && r.valgus < 0.75) flags.push("valgus");
  const base = repList.slice(0, 2);
  if (EX.checks.includes("fatigue") && base.length === 2 && r.min - (base[0].min + base[1].min) / 2 > 10) flags.push("fatigue");
  const score = Math.max(0, 100 - flags.reduce((s, f) => s + ({ depth:30, lockout:15, tempo:20, hip:25, sym:15, valgus:25, fatigue:10 }[f] || 10), 0));
  repList.push({ n: reps, min: r.min, max: r.max, ecc, con, flags, score });
  EX.checks.forEach(c => setChk(c, flags.includes(c) ? "on" : "ok"));
  const PRIO = ["hip","valgus","tempo","depth","lockout","sym","fatigue"];
  const top = PRIO.find(p => flags.includes(p));
  const CUE = { hip:"엉덩이 붙이세요", valgus:"무릎 벌리세요", tempo: ecc < 0.5 ? "천천히 내리세요" : "반동 쓰지 마세요", depth: EX.cueLow, lockout: EX.cueHigh, sym:"양쪽 같이 미세요", fatigue:"가동범위가 줄고 있어요" };
  speak(top ? `${reps}회, ${CUE[top]}` : `${reps}회`, top ? "warn" : "good");
}

// ───────── 리포트 ─────────
$("endSetBtn").onclick = showReport;
$("nextSetBtn").onclick = () => { setNo++; resetSet(); closeSheets(); toast(`${setNo}세트 시작`); speak(`${setNo}세트`, "info"); };
function showReport() {
  if (!repList.length) { toast("기록된 반복이 없어요"); return; }
  $("reportTitle").textContent = `${EX.name} · ${setNo}세트 리포트`;
  const n = repList.length, avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const avgScore = avg(repList.map(r => r.score)), avgMin = avg(repList.map(r => r.min));
  const first = repList.slice(0, Math.min(3, n)), last = repList.slice(-Math.min(3, n));
  const romKeep = n >= 4 ? Math.round(100 - Math.max(0, avg(last.map(r => r.min)) - avg(first.map(r => r.min))) / Math.max(1, 180 - avg(first.map(r => r.min))) * 100) : null;
  const tempo = avg(repList.map(r => r.ecc)).toFixed(1) + "s / " + avg(repList.map(r => r.con)).toFixed(1) + "s";
  const cnt = {}; repList.forEach(r => r.flags.forEach(f => cnt[f] = (cnt[f] || 0) + 1));
  $("kpis").innerHTML = `
    <div class="kpi"><b>${n}회</b><span>반복</span></div>
    <div class="kpi"><b class="${avgScore >= 80 ? "ok" : "bad"}">${avgScore.toFixed(0)}</b><span>평균 점수</span></div>
    <div class="kpi"><b>${avgMin.toFixed(0)}°</b><span>평균 최저 각도</span></div>
    <div class="kpi"><b style="font-size:16px">${tempo}</b><span>템포 ↓/↑</span></div>
    ${romKeep != null ? `<div class="kpi"><b class="${romKeep >= 90 ? "ok" : "bad"}">${romKeep}%</b><span>가동범위 유지</span></div>` : ""}`;
  const worst = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const ADVICE = {
    depth: "가동범위가 부족한 반복이 많아요. 무게를 5~10% 낮추고 기준선까지 내려가는 데 집중해 보세요.",
    lockout: "끝까지 펴지 않고 다음 반복으로 넘어가는 경향이 있어요. 위에서 잠깐 멈추세요.",
    tempo: "내리는 속도가 빠르거나 반동을 쓰고 있어요. 내릴 때 2초, 밀 때 1초를 목표로 하세요.",
    hip: "엉덩이가 등받이에서 떠요. 허리 부담이 커지니 가동범위를 줄이거나 발 위치를 조정하세요.",
    sym: "좌우가 다르게 움직여요. 약한 쪽을 의식해서 같이 밀어보세요.",
    valgus: "무릎이 안쪽으로 모여요. 발끝 방향으로 무릎을 벌린다는 느낌으로 미세요.",
    fatigue: "세트 후반에 가동범위가 줄었어요. 반복 수를 줄이거나 휴식을 늘려보세요.",
  };
  $("advice").innerHTML = worst.length
    ? `<b>가장 많이 나온 문제:</b> ${worst.slice(0, 2).map(([f, c]) => `${CHECK_LABEL[f]} (${c}회)`).join(", ")}<br>${ADVICE[worst[0][0]]}`
    : "<b>깔끔한 세트예요.</b> 모든 반복이 기준을 통과했어요. 다음 세트는 무게를 조금 올려볼 수 있어요.";
  logEl.innerHTML = repList.map(r => {
    const tags = r.flags.length ? r.flags.map(f => `<span class="tag">${CHECK_LABEL[f]}</span>`).join("") : `<span class="tag ok">좋음</span>`;
    return `<div><span class="score ${r.score >= 80 ? "ok" : "bad"}">${r.score}</span> #${r.n} · ${r.min.toFixed(0)}~${r.max.toFixed(0)}° · ↓${r.ecc.toFixed(1)}s ↑${r.con.toFixed(1)}s · ${tags}</div>`;
  }).join("");
  openSheet("reportSheet");
  requestAnimationFrame(() => drawChart(repList, +downTh.value));
}
function drawChart(list, low) {
  const c = $("chart"), g = c.getContext("2d");
  const W = c.clientWidth || 300, H = c.clientHeight || 130;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio; g.scale(devicePixelRatio, devicePixelRatio);
  const padL = 36, padB = 18, padT = 18;
  const ys = list.map(r => r.min), minY = Math.min(...ys, low) - 10, maxY = Math.max(...ys, low) + 10;
  const x = i => padL + (W - padL - 8) * (i + 0.5) / list.length, y = v => padT + (H - padT - padB) * (1 - (v - minY) / (maxY - minY));
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "#3a4450"; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(padL, y(low)); g.lineTo(W - 8, y(low)); g.stroke(); g.setLineDash([]);
  g.fillStyle = "#8a97a6"; g.font = "11px system-ui"; g.textAlign = "right"; g.fillText(low + "°", padL - 4, y(low) + 4);
  const bw = Math.max(6, (W - padL - 8) / list.length * 0.6);
  list.forEach((r, i) => { g.fillStyle = r.min <= low ? "#3ddc84" : "#ff5c5c"; g.fillRect(x(i) - bw / 2, y(r.min), bw, y(minY) - y(r.min)); g.fillStyle = "#8a97a6"; g.textAlign = "center"; g.fillText(r.n, x(i), H - 4); });
  g.textAlign = "left"; g.fillText("반복별 최저 각도 (낮을수록 깊게)", padL + 4, 12);
}

// ───────── 그리기 ─────────
const EDGES = [[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32],[11,13],[13,15],[12,14],[14,16]];
function draw(lm, tri) {
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const P = i => ({ x: lm[i].x * canvas.width, y: lm[i].y * canvas.height });
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(79,195,247,.85)"; ctx.lineCap = "round";
  for (const [a, b] of EDGES) { const p = P(a), q = P(b); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
  const [a, b, c] = tri;
  ctx.lineWidth = 7; ctx.strokeStyle = phase === "low" ? "#3ddc84" : "#ffb020";
  ctx.beginPath(); ctx.moveTo(P(a).x, P(a).y); ctx.lineTo(P(b).x, P(b).y); ctx.lineTo(P(c).x, P(c).y); ctx.stroke();
  for (const i of tri) { ctx.beginPath(); ctx.arc(P(i).x, P(i).y, 8, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill(); }
  if (hipAnchor && EX.checks.includes("hip")) { ctx.strokeStyle = "rgba(255,176,32,.7)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hipAnchor.x * canvas.width, hipAnchor.y * canvas.height, 14, 0, Math.PI * 2); ctx.stroke(); }
}
function features(lm, side) {
  const S = side === "L" ? lm[LM.LS] : lm[LM.RS], H = side === "L" ? lm[LM.LH] : lm[LM.RH];
  const f = { hip: { x: H.x, y: H.y }, torso: dist(S, H) || 1 };
  const J = JOINT[EX.joint];
  const vL = (lm[J.L[0]].visibility + lm[J.L[1]].visibility + lm[J.L[2]].visibility) / 3;
  const vR = (lm[J.R[0]].visibility + lm[J.R[1]].visibility + lm[J.R[2]].visibility) / 3;
  if (vL > 0.6 && vR > 0.6) {
    f.symDiff = Math.abs(angleAt(lm[J.L[0]], lm[J.L[1]], lm[J.L[2]]) - angleAt(lm[J.R[0]], lm[J.R[1]], lm[J.R[2]]));
    if (EX.joint === "knee") {
      const kneeGap = Math.abs(lm[LM.LK].x - lm[LM.RK].x), ankleGap = Math.abs(lm[LM.LA].x - lm[LM.RA].x), hipGap = Math.abs(lm[LM.LH].x - lm[LM.RH].x);
      if (hipGap > 0.08 && ankleGap > 0.02) f.valgus = kneeGap / ankleGap;
    }
  }
  return f;
}
function loop() {
  if (!running) return;
  const t = performance.now();
  const res = landmarker.detectForVideo(video, t);
  frames++; if (t - lastT > 1000) { $("fps").textContent = frames; frames = 0; lastT = t; }
  if (res.landmarks && res.landmarks[0]) {
    const lm = res.landmarks[0], J = JOINT[EX.joint];
    const visOf = tri => (lm[tri[0]].visibility + lm[tri[1]].visibility + lm[tri[2]].visibility) / 3;
    const visL = visOf(J.L), visR = visOf(J.R);
    const side = visL >= visR ? "L" : "R", tri = J[side], vis = Math.max(visL, visR);
    $("side").textContent = (side === "L" ? "왼쪽 " : "오른쪽 ") + J.label.replace(" 각도", ""); $("conf").textContent = (vis * 100).toFixed(0) + "%";
    let raw = angleAt(lm[tri[0]], lm[tri[1]], lm[tri[2]]);
    if (raw < J.minPhys) raw = lastGood ?? raw; else lastGood = raw;
    const med = median(raw);
    if (!(smooth != null && Math.abs(med - smooth) > 40)) smooth = smooth == null ? med : smooth * 0.5 + med * 0.5;
    angleEl.textContent = smooth.toFixed(0);
    draw(lm, tri);
    if (vis > CONF_TH) judge(smooth, vis, features(lm, side)); else hint("관절이 잘 안 보여요", "info");
  } else { ctx.clearRect(0, 0, canvas.width, canvas.height); angleEl.textContent = "--"; hint("사람이 인식되지 않아요", "info"); }
  requestAnimationFrame(loop);
}

// ───────── 카메라 ─────────
const isPhone = /Android|iPhone|iPad/i.test(navigator.userAgent);
let facing = isPhone ? "environment" : "user", starting = false, currentStream = null;
$("preFacing").textContent = (facing === "user" ? "전면" : "후면") + " 카메라로 시작 · 눌러서 변경";
$("preFacing").onclick = e => { facing = facing === "user" ? "environment" : "user"; e.target.textContent = (facing === "user" ? "전면" : "후면") + " 카메라로 시작 · 눌러서 변경"; };

async function listCams() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    camSel.innerHTML = "";
    devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || `카메라 ${i + 1}`; if (/screen|virtual|obs|record/i.test(d.label)) camSel.append(o); else camSel.prepend(o); });
  } catch {}
}
async function openCamera(opts) {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  const vc = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (opts.deviceId) vc.deviceId = { exact: opts.deviceId }; else vc.facingMode = { ideal: opts.facing };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: false }); }
  catch { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
  currentStream = stream;
  try {
    const tr = stream.getVideoTracks()[0], s = tr.getSettings(), lbl = (tr.label || "").toLowerCase();
    if (s.facingMode) facing = s.facingMode; else if (/back|rear|environment|후면/.test(lbl)) facing = "environment"; else if (/front|user|전면|facetime|integrated|webcam/.test(lbl)) facing = "user";
    await listCams(); camSel.value = s.deviceId || camSel.value;
  } catch {}
  mirrored = facing === "user"; applyMirrorCss();
  video.srcObject = stream;
  await new Promise(res => { if (video.readyState >= 1) res(); else video.onloadedmetadata = () => res(); });
  try { await video.play(); } catch (e) { if (e.name !== "AbortError") throw e; }
  win.length = 0; smooth = null; lastGood = null; phase = null; cur = null; hipAnchor = null;
}
startBtn.onclick = async () => {
  if (starting) return; starting = true; startBtn.disabled = true; startBtn.textContent = "카메라 여는 중...";
  unlockAudio();
  try {
    await openCamera({ facing });
    overlay.hidden = true; running = true;
    speak(EX.name + " 시작합니다", "info");
    requestAnimationFrame(loop);
  } catch (e) { statusEl.textContent = "카메라를 열 수 없어요: " + e.name; }
  finally { starting = false; startBtn.disabled = false; startBtn.textContent = "시작"; }
};
$("switchBtn").onclick = async () => {
  if (starting || !running) return; starting = true;
  try {
    facing = facing === "user" ? "environment" : "user";
    if (isPhone) await openCamera({ facing });
    else { const n = camSel.options.length; if (n > 1) camSel.selectedIndex = (camSel.selectedIndex + 1) % n; await openCamera({ deviceId: camSel.value }); }
    toast(facing === "user" ? "전면 카메라" : "후면 카메라");
  } catch (e) { toast("카메라 전환 실패"); }
  finally { starting = false; }
};
camSel.onchange = async () => { if (running && !starting) { starting = true; try { await openCamera({ deviceId: camSel.value }); } catch {} finally { starting = false; } } };

async function init() {
  try {
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = delegate => ({ baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate }, runningMode: "VIDEO", numPoses: 1 });
    try { landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU")); } catch { landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
    statusEl.textContent = "종목을 고르고 시작을 누르세요.";
    startBtn.disabled = false; startBtn.textContent = "시작";
    await listCams();
  } catch (e) { statusEl.textContent = "모델 로딩 실패: 인터넷 연결을 확인하세요. (" + e.message + ")"; }
}
init();
</script>
